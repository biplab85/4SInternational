          - generic [ref=e483]: What should I do if I find termites?
        - generic:
          - paragraph: Don't disturb them. Don't spray store-bought repellent on them — that scatters the colony and makes detection harder. Call us and we'll book an inspection. Termite work needs to be done in a specific order to actually solve the problem.
      - listitem [ref=e485]:
        - button "02 How often should I have my home inspected?" [ref=e486] [cursor=pointer]:
          - generic [ref=e487]: "02"
          - generic [ref=e488]: How often should I have my home inspected?
        - generic:
          - paragraph:
            - text: "For termites:"
            - strong [ref=e490]: annually
            - text: ". For general pest activity: a refresher treatment every six to twelve months keeps things quiet. Sydney's climate is forgiving to pests — yearly is the floor, not the ceiling."
      - listitem [ref=e491]:
        - button "03 Are the chemicals safe for children and pets?" [ref=e492] [cursor=pointer]:
          - generic [ref=e493]: "03"
          - generic [ref=e494]: Are the chemicals safe for children and pets?
        - generic:
          - paragraph: Yes — once they've dried. We use professional, registered products applied in low concentration to surfaces, not in the air. We ask everyone to leave during application and return after 1–2 hours, by which point everything is settled and safe.
      - listitem [ref=e496]:
        - button "04 When should I clean carpets after a treatment?" [ref=e497] [cursor=pointer]:
          - generic [ref=e498]: "04"
          - generic [ref=e499]: When should I clean carpets after a treatment?
        - generic:
          - paragraph:
            - text: Wait at least
            - strong [ref=e501]: two weeks
            - text: . Steam cleaning earlier removes the residual treatment from carpet fibers and shortens the warranty period.
      - listitem [ref=e502]:
        - button "05 What should I expect after treatment?" [ref=e503] [cursor=pointer]:
          - generic [ref=e504]: "05"
          - generic [ref=e505]: What should I expect after treatment?
        - generic:
          - paragraph: A spike in activity for a few days is normal — that's pests being flushed out of harborage. Within a week activity drops sharply. By two weeks, you should see very little. If you don't, call us and we'll come back.
      - listitem [ref=e507]:
        - button "06 Do you need access to the whole house?" [ref=e508] [cursor=pointer]:
          - generic [ref=e509]: "06"
          - generic [ref=e510]: Do you need access to the whole house?
        - generic:
          - paragraph: "Yes — internal treatment needs every accessible room: kitchens, bathrooms, bedrooms, laundry, garage. Roof and subfloor access if available. Skipping rooms creates pest \"safe zones\" that recolonize the rest of the house."
      - listitem [ref=e512]:
        - button "07 What warranty do you offer?" [ref=e513] [cursor=pointer]:
          - generic [ref=e514]: "07"
          - generic [ref=e515]: What warranty do you offer?
        - generic:
          - paragraph:
            - strong [ref=e517]: Six months
            - text: on general pest treatments.
            - strong [ref=e518]: Three months
            - text: on ants (ants are seasonal and behave differently). If pests come back inside the warranty window, so do we — at no extra cost.
      - listitem [ref=e519]:
        - button "08 How long does a treatment take?" [ref=e520] [cursor=pointer]:
          - generic [ref=e521]: "08"
          - generic [ref=e522]: How long does a treatment take?
        - generic:
          - paragraph: "A standard home: 45 minutes to an hour. A larger home or a commercial site: 90 minutes to two hours. Termite inspections sit in the same range depending on roof and subfloor access."
      - listitem [ref=e524]:
        - button "09 Do you treat strata properties?" [ref=e525] [cursor=pointer]:
          - generic [ref=e526]: "09"
          - generic [ref=e527]: Do you treat strata properties?
        - generic:
          - paragraph: Yes — common areas, individual units, and full-building programs. We work directly with strata managers and property managers and provide compliant reporting after every visit.
      - listitem [ref=e529]:
        - button "10 Can you handle restaurants and food premises?" [ref=e530] [cursor=pointer]:
          - generic [ref=e531]: "10"
          - generic [ref=e532]: Can you handle restaurants and food premises?
        - generic:
          - paragraph: Yes — we work with restaurants, cafés, aged-care kitchens and schools. Treatments are scheduled outside service hours, use food-safe products, and come with the documentation councils ask for during audits.
      - listitem [ref=e534]:
        - button "11 What areas do you service?" [ref=e535] [cursor=pointer]:
          - generic [ref=e536]: "11"
          - generic [ref=e537]: What areas do you service?
        - generic:
          - paragraph: Sydney Metro and Greater Sydney. Most metro callouts run within 60 minutes. If you're not sure whether we cover your suburb, ring us — we usually do.
      - listitem [ref=e539]:
        - button "12 Do you offer one-off jobs, or only contracts?" [ref=e540] [cursor=pointer]:
          - generic [ref=e541]: "12"
          - generic [ref=e542]: Do you offer one-off jobs, or only contracts?
        - generic:
          - paragraph: Both. Most residential jobs are one-off treatments with a six-month warranty. Commercial sites usually prefer a scheduled program. We'll recommend whichever actually fits your situation — no contracts pushed for the sake of contracts.
      - listitem [ref=e544]:
        - button "13 How do I book?" [ref=e545] [cursor=pointer]:
          - generic [ref=e546]: "13"
          - generic [ref=e547]: How do I book?
        - generic:
          - paragraph:
            - text: Call
            - link "02 9592 5452" [ref=e549] [cursor=pointer]:
              - /url: tel:0295925452
              - strong [ref=e550]: 02 9592 5452
            - text: ", email"
            - link "info@effective-pestcontrol.com.au" [ref=e551] [cursor=pointer]:
              - /url: mailto:info@effective-pestcontrol.com.au
            - text: ", or fill in the form below. We answer the phone ourselves — no call centre."
