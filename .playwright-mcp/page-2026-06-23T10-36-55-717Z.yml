        - paragraph [ref=e78]: Our Founder
        - paragraph [ref=e80]: Fatema Islam, Founder and General Manager
      - generic [ref=e81]:
        - paragraph [ref=e82]: Ms. Islam has worked in the bearing trade since 2019, operating S.S Bearing and Machineries on Nawabpur Road in Dhaka, Bangladesh. Over six years, she has built sourcing relationships with manufacturers across China, Japan, Thailand, and India, negotiating pricing, coordinating international shipping, and verifying product quality against ABEC and ISO 492 standards.
        - paragraph [ref=e83]: She holds bearing inventory valued at approximately CAD $185,000 through her existing operations. Her trade credentials are registered with Bangladesh's National Board of Revenue, Dhaka South City Corporation, and VAT authorities.
        - paragraph [ref=e84]: 4S International brings Ms. Islam's sourcing expertise and supplier network to the Canadian market.
