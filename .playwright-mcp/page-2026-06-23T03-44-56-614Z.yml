          - text: "HS Code: 8482.10 | Canadian MFN Duty: Free"
          - paragraph [ref=e51]: Designed for combined radial and axial loads. Available in single-row (15, 25, 40 degree contact angles) and matched-pair configurations for back-to-back (DB), face-to-face (DF), and tandem (DT) mounting.
          - paragraph [ref=e53]: "Common applications: Machine tool spindles, pump shafts, compressors, centrifuges."
